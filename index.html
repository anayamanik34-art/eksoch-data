<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Eksoch Data Store</title>
  <meta name="description" content="Datasets, dashboards, SQL courses and Excel templates by Eksoch Analytics. Browse the collection, grab the free cheat sheets and buy on Gumroad.">
  <meta name="theme-color" content="#1f2347">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="wrap top">
      <div class="brand">
        <img src="icons/icon-192.png" alt="" width="44" height="44">
        <div>
          <h1>Eksoch Data Store</h1>
          <p>Datasets, dashboards &amp; data skills by Eksoch Analytics</p>
        </div>
      </div>
      <a class="btn ghost" id="store-link" target="_blank" rel="noopener">Gumroad store ↗</a>
    </div>
    <div class="wrap stats" id="stats"></div>
  </header>

  <div class="wrap">
    <nav class="tabs" id="tabs" aria-label="Categories" role="tablist"></nav>

    <section class="toolbar">
      <input type="search" id="search" placeholder="Search, e.g. SQL, retail, Excel, census" aria-label="Search products">
      <label class="toggle"><input type="checkbox" id="free-only"> Free only</label>
    </section>

    <section id="banner" class="banner" hidden></section>

    <main id="grid" class="grid" aria-live="polite"></main>
    <p id="empty" class="empty" hidden>No products match your search.</p>

    <footer>
      <p>© Eksoch Analytics. Prices in Australian dollars. Purchases happen on Gumroad.
        <a href="privacy.html">Privacy</a></p>
    </footer>
  </div>

  <dialog id="viewer" aria-labelledby="v-title">
    <form method="dialog"><button class="close" aria-label="Close">✕</button></form>
    <div class="v-media">
      <img id="v-img" alt="">
      <div id="v-thumbs" class="v-thumbs"></div>
    </div>
    <div class="v-body">
      <p id="v-cat" class="v-cat"></p>
      <h2 id="v-title"></h2>
      <p id="v-summary" class="v-summary"></p>
      <dl id="v-details" class="details"></dl>
      <h3>What you get</h3>
      <ul id="v-highlights" class="highlights"></ul>
      <div class="buy">
        <span id="v-price" class="price big"></span>
        <a id="v-buy" class="btn primary" target="_blank" rel="noopener"></a>
      </div>
      <p class="fine">Opens the product on Gumroad, where you pay and download.</p>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
